[project]
name = "splunk-drawio-icons"
version = "0.1.0"
description = "Build draw.io shape libraries from Splunk’s documentation icon sheet"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "scipy>=1.10.0",
    "vtracer>=0.6.15",
]

[project.optional-dependencies]
ocr = [
    "easyocr>=1.7.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
